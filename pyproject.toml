[project]
name = "llm-eval-mcp"
version = "0.1.0"
description = "Un serveur MCP qui expose des outils d'évaluation de fiabilité des agents LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nonvignon Candy Aho" }]
dependencies = [
    "mcp[cli]>=2.0,<3",
    "groq>=0.11",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
llm-eval-mcp = "llm_eval_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
